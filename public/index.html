<!DOCTYPE html>
<html>
<head>
    <title>Queen Leesha MD Pairing</title>
    <style>
        body { background: #0f0c29; color: white; font-family: sans-serif; text-align: center; padding-top: 50px; }
        input { padding: 10px; border-radius: 5px; border: none; width: 250px; }
        button { padding: 10px 20px; background: #ff007f; color: white; border: none; border-radius: 5px; cursor: pointer; }
        #codeDisplay { font-size: 2em; margin-top: 20px; color: #00ffcc; letter-spacing: 5px; }
    </style>
</head>
<body>
    <h1>👑 Queen Leesha MD-V1</h1>
    <p>Enter your phone number with country code (e.g. 234xxx)</p>
    <input type="text" id="number" placeholder="2347041560392">
    <button onclick="getPairingCode()">Get Code</button>
    <div id="codeDisplay"></div>
    <p id="status"></p>

    <script>
        async function getPairingCode() {
            const num = document.getElementById('number').value;
            const display = document.getElementById('codeDisplay');
            const status = document.getElementById('status');
            
            status.innerText = "Generating code... please wait";
            display.innerText = "";

            try {
                const response = await fetch(`/pair?number=${num}`);
                const data = await response.json();
                if (data.code) {
                    display.innerText = data.code;
                    status.innerText = "Enter this code on your WhatsApp Notification.";
                } else {
                    status.innerText = "Error: " + data.error;
                }
            } catch (e) {
                status.innerText = "Failed to connect to server.";
            }
        }
    </script>
</body>
</html>
