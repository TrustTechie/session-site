<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queen Leesha Pairing</title>
    <style>
        body { background-color: #0d1117; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background-color: #161b22; padding: 40px; border-radius: 15px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); width: 350px; text-align: center; border: 1px solid #30363d; }
        h2 { color: #ff007f; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: white; box-sizing: border-box; }
        button { background-color: #ff007f; color: white; border: none; padding: 12px 25px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.3s; }
        button:hover { background-color: #d0006b; }
        #code { font-size: 24px; font-weight: bold; color: #00ffcc; margin-top: 20px; letter-spacing: 3px; }
        #status { margin-top: 15px; font-size: 14px; color: #8b949e; }
    </style>
</head>
<body>
    <div class="card">
        <h2>👑 Queen Leesha</h2>
        <p>Enter number with country code</p>
        <input type="text" id="phone" placeholder="2347041560392">
        <button onclick="getCode()">Get Pairing Code</button>
        <div id="code"></div>
        <div id="status"></div>
    </div>

    <script>
        async function getCode() {
            const num = document.getElementById('phone').value;
            const codeDiv = document.getElementById('code');
            const statusDiv = document.getElementById('status');
            
            if(!num) return alert("Enter a number!");
            
            codeDiv.innerText = "";
            statusDiv.innerText = "Requesting code... ⏳";

            try {
                const res = await fetch(`/pair?number=${num}`);
                const data = await res.json();
                if(data.code) {
                    codeDiv.innerText = data.code;
                    statusDiv.innerText = "Notification sent! Enter code on your phone.";
                } else {
                    statusDiv.innerText = "Error: " + (data.error || "Unknown");
                }
            } catch (e) {
                statusDiv.innerText = "Server Unreachable.";
            }
        }
    </script>
</body>
</html>
